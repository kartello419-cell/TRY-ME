
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>TRY ME | Find Your Forever</title>
<style>
:root{--gold:#e1b65b;--bg:#090909;--card:#171717;--line:#393020;--text:#fff8e9;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#0b0b0b;border-bottom:1px solid var(--line);padding:17px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.logo{font-size:25px;font-weight:900;letter-spacing:3px;color:var(--gold)}
.logo small{display:block;font-size:9px;letter-spacing:2px;margin-top:4px;color:#ddd}
main{max-width:900px;margin:auto;padding:18px 14px 100px}
h1{font-size:30px}h2{font-size:21px}
p{color:#d0c8b9;line-height:1.6}
.gold{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;margin:13px 0}
.hero{background:radial-gradient(ellipse at top right,#51401d,#17130b 50%,#101010);border:1px solid #655025;border-radius:22px;padding:25px;margin-bottom:20px}
button{font-size:14px;cursor:pointer}
.btn{padding:12px 15px;border:1px solid var(--gold);border-radius:10px;background:var(--gold);color:#15110a;font-weight:bold}
.btn.alt{background:transparent;color:var(--gold)}
.btn.dark{background:#211d14;color:white;border-color:var(--line)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.tile{background:linear-gradient(145deg,#282010,#151515);border:1px solid #49391e;border-radius:14px;padding:15px;color:white;text-align:left;min-height:105px}
.tile b{display:block;margin:10px 0 6px}
.tile span{color:var(--muted);font-size:12px}
.symbol{font-size:24px;color:var(--gold)}
.member{overflow:hidden;padding:0}
.art{height:135px;display:grid;place-items:center;background:radial-gradient(circle,#6a522d,#211b10);font-size:56px}
.details{padding:13px}
label{display:block;color:var(--gold);font-size:13px;margin:13px 0 7px}
input,select,textarea{width:100%;padding:12px;background:#0d0d0d;border:1px solid #4a4030;color:white;border-radius:9px}
textarea{min-height:80px}
.muted{font-size:12px;color:var(--muted)}
.pill{display:inline-block;border:1px solid #59451f;border-radius:30px;padding:5px 9px;color:var(--gold);font-size:11px}
.plan{border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.featured{border-color:var(--gold);background:#211a0c}
.price{font-size:27px;color:var(--gold);font-weight:bold}
.notice{border-left:3px solid var(--gold);padding:12px;background:#211b10;color:#d9cba9;font-size:12px;line-height:1.6;margin:15px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0b0bf5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:8;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#aaa;font-size:10px;padding:5px 0}
nav button span{display:block;font-size:20px;margin-bottom:4px}
nav button.active{color:var(--gold)}
.hidden{display:none!important}
footer{text-align:center;color:#777;font-size:11px;padding:20px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:35px}}
</style>
</head>
<body>
<header>
  <div class="logo">TRY ME<small>YOUR JOURNEY TO FOREVER</small></div>
  <button class="btn alt" onclick="page('profile')">My Profile</button>
</header>
<main id="app"></main>
<nav id="nav">
<button data-page="home" onclick="page('home')"><span>⌂</span>Home</button>
<button data-page="discover" onclick="page('discover')"><span>♡</span>Discover</button>
<button data-page="matches" onclick="page('matches')"><span>✦</span>Matches</button>
<button data-page="messages" onclick="page('messages')"><span>▤</span>Messages</button>
<button data-page="profile" onclick="page('profile')"><span>◉</span>Profile</button>
</nav>
<script>
const OWNER="balesaniccur@gmail.com";
const people=[
{id:1,name:"Amina",age:26,country:"Kenya",goal:"Marriage",emoji:"🌹",bio:"I value honesty, family and meaningful conversations.",interests:"Travel · Cooking · Family"},
{id:2,name:"Daniel",age:29,country:"Uganda",goal:"Marriage",emoji:"🤵",bio:"Looking for a genuine partner to build a future with.",interests:"Business · Nature · Music"},
{id:3,name:"Grace",age:25,country:"Tanzania",goal:"Serious Relationship",emoji:"🌷",bio:"I enjoy laughter, new experiences and deep conversations.",interests:"Travel · Reading · Art"},
{id:4,name:"Michael",age:31,country:"Kenya",goal:"Marriage",emoji:"⭐",bio:"Respect, trust and commitment matter to me.",interests:"Fitness · Family · Travel"},
{id:5,name:"Zuri",age:27,country:"Rwanda",goal:"Marriage",emoji:"🌺",bio:"Hoping to find a sincere connection that grows into forever.",interests:"Culture · Nature · Music"},
{id:6,name:"Samuel",age:28,country:"Ghana",goal:"Serious Relationship",emoji:"🕊️",bio:"Kindness and communication are important to me.",interests:"Reading · Food · Travel"}
];
let s={page:"welcome",name:"",age:18,country:"Kenya",goal:"Marriage",bio:"",interests:[],likes:[],matches:[],chats:{}};
try{s={...s,...JSON.parse(localStorage.getItem("tryme_v1")||"{}")}}catch(e){}
const app=document.getElementById("app");
function save(){try{localStorage.setItem("tryme_v1",JSON.stringify(s))}catch(e){}}
function page(p){s.page=p;save();render();window.scrollTo(0,0)}
function button(t,fn,cls=""){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}
function heading(t,sub=""){return `<h2>${t}</h2>${sub?`<p class="muted">${sub}</p>`:""}`}
function note(){return `<div class="notice">DEMO MODE: Profiles and interactions are examples. Real accounts, messaging and payments are not connected yet.</div>`}
function welcome(){return `<div class="hero"><div class="gold">A NEW CHAPTER STARTS HERE</div><h1>Find your <span class="gold">forever.</span></h1><p>Meet people who share your values. Discover meaningful relationships and build a future together.</p><div class="actions">${button("Create My Profile","page('signup')")}${button("Explore Portal","guest()","alt")}</div><p class="muted">Worldwide · Adults 18+ · Love with intention</p></div><div class="card">${heading("Welcome to TRY ME","More than a dating app. It's a journey to forever.")}<div class="grid"><div class="tile"><span class="symbol">♡</span><b>Real intentions</b><span>Marriage and serious relationships</span></div><div class="tile"><span class="symbol">✦</span><b>Shared values</b><span>Discover what matters to you</span></div></div></div><div class="card"><h3>18+ age requirement</h3><p>This portal is intended for adults aged 18 and above. Please use it respectfully and protect your personal information.</p>${button("I'm 18+ · Continue","page('signup')")}</div>`}
function signup(){return `${heading("Create your profile","Tell us a little about yourself")}<div class="card"><form onsubmit="create(event"><label>Display name</label><input name="name" required maxlength="40" placeholder="Your display name"><label>Age (18+)</label><input name="age" type="number" min="18" max="100" value="18" required><label>Country</label><select name="country"><option>Kenya</option><option>Uganda</option><option>Tanzania</option><option>Rwanda</option><option>Nigeria</option><option>Ghana</option><option>South Africa</option><option>United Kingdom</option><option>United States</option><option>Other</option></select><label>Relationship goal</label><select name="goal"><option>Marriage</option><option>Serious Relationship</option><option>Friendship</option><option>Not Sure Yet</option></select><label>About you</label><textarea name="bio" maxlength="300" placeholder="Describe yourself"></textarea><label><input type="checkbox" required style="width:auto"> I confirm that I am at least 18 years old.</label><div class="actions"><button class="btn">Continue</button>${button("Back","page('welcome')","alt")}</div></form></div><p class="muted">Prototype only: this profile is saved on your device, not registered online.</p>`}
function create(e){e.preventDefault();let f=new FormData(e.target);if(+f.get("age")<18)return alert("You must be 18 or older.");s.name=f.get("name").trim();s.age=+f.get("age");s.country=f.get("country");s.goal=f.get("goal");s.bio=f.get("bio");save();page("interests")}
function interests(){let a=["Family","Travel","Faith","Music","Cooking","Business","Nature","Fitness","Reading","Art","Culture","Sports"];return `${heading("Your interests","Choose a few things you enjoy")}<div class="card"><div class="grid">${a.map(x=>`<button class="tile" onclick="interest('${x}')" style="border-color:${s.interests.includes(x)?"var(--gold)":"var(--line)"}">${s.interests.includes(x)?"✓":"♡"}<b>${x}</b></button>`).join("")}</div><div class="actions">${button("Enter TRY ME","page('home')")}</div></div>`}
function interest(x){s.interests=s.interests.includes(x)?s.interests.filter(y=>y!==x):[...s.interests,x];save();render()}
function guest(){s.name="Guest";s.age=25;save();page("home")}
function home(){return `<div class="hero"><div class="gold">YOUR PERSONAL PORTAL</div><h1>Welcome${s.name?", "+esc(s.name):""} 💛</h1><p>Your next meaningful connection could begin with a conversation.</p>${button("Discover Members","page('discover')")}</div><div class="grid"><div class="card"><div class="price">${s.likes.length}</div><span class="muted">Likes sent</span></div><div class="card"><div class="price">${s.matches.length}</div><span class="muted">Demo matches</span></div></div>${heading("Your dashboard","Everything in one place")}<div class="grid">${tile("♡","Discover","Meet members","discover")}${tile("✦","Likes & Matches","Your connections","matches")}${tile("▤","Messages","Sample inbox","messages")}${tile("◉","My Profile","Edit your details","profile")}${tile("♛","Premium","Membership plans","premium")}${tile("◇","Offers & Events","Community updates","events")}${tile("✧","Contact AI","Relationship guidance","ai")}${tile("✉","Contact Owner","Talk to our team","owner")}${tile("⚙","Settings","Manage your demo","settings")}</div>${note()}`}
function tile(sym,title,sub,p){return `<button class="tile" onclick="page('${p}')"><span class="symbol">${sym}</span><b>${title}</b><span>${sub}</span></button>`}
function member(m){return `<div class="card member"><div class="art">${m.emoji}</div><div class="details"><h3>${m.name}, ${m.age}</h3><span class="pill">${m.goal}</span><p>⌖ ${m.country}</p><p>${m.bio}</p><p class="muted">${m.interests}</p><div class="actions">${button(s.likes.includes(m.id)?"♥ Liked":"♡ Like",`like(${m.id})`,"")}${button("Message",`chat(${m.id})`,"alt")}</div></div></div>`}
function discover(){return `${heading("Discover","Sample members from around the world")}<div class="grid">${people.map(member).join("")}</div>${note()}`}
function like(id){if(!s.likes.includes(id))s.likes.push(id);if(!s.matches.includes(id)&&s.likes.length%2===0)s.matches.push(id);save();render();alert("Demo like saved on this device. This is not a real member connection.")}
function matches(){let a=people.filter(m=>s.likes.includes(m.id)||s.matches.includes(m.id));return `${heading("Likes & Matches","People you interacted with in the demo")}${a.length?`<div class="grid">${a.map(member).join("")}</div>`:`<div class="card"><p>No connections yet. Discover members to try the feature.</p>${button("Discover","page('discover')")}</div>`}${note()}`}
function messages(){return `${heading("Messages","Sample conversations")}<div class="card"><p>Real private messaging requires secure accounts and a backend.</p>${people.slice(0,4).map(m=>`<button class="tile" style="width:100%;margin:5px 0" onclick="chat(${m.id})"><b>${m.emoji} ${m.name}</b><span>Open demo conversation →</span></button>`).join("")}</div>${note()}`}
function chat(id){let m=people.find(x=>x.id===id);let arr=s.chats[id]||[];app.innerHTML=`${heading("Chat with "+m.name,"Demo conversation only")}<div class="card"><div class="notice">${m.name}: Hello! What matters most to you in a relationship?</div>${arr.map(t=>`<p style="text-align:right;color:var(--gold)">${esc(t)}</p>`).join("")}<form onsubmit="send(event,${id})"><label>Your message</label><textarea name="text" required maxlength="500"></textarea><div class="actions"><button class="btn">Add demo message</button>${button("Back","page('messages')","alt")}</div></form></div>${note()}`}
function send(e,id){e.preventDefault();s.chats[id]=[...(s.chats[id]||[]),new FormData(e.target).get("text")];save();chat(id)}
function profile(){return `${heading("My Profile","Your personal introduction")}<div class="card"><div class="art">◉</div><form onsubmit="saveProfile(event)"><label>Display name</label><input name="name" required value="${esc(s.name)}"><label>Age</label><input name="age" type="number" min="18" max="100" value="${s.age}"><label>Country</label><input name="country" value="${esc(s.country)}"><label>Relationship goal</label><select name="goal">${["Marriage","Serious Relationship","Friendship","Not Sure Yet"].map(x=>`<option ${s.goal===x?"selected":""}>${x}</option>`).join("")}</select><label>About me</label><textarea name="bio">${esc(s.bio)}</textarea><p class="muted">Interests: ${s.interests.map(esc).join(" · ")||"Not selected"}</p><div class="actions"><button class="btn">Save profile</button>${button("Edit interests","page('interests')","alt")}</div></form></div>${note()}`}
function saveProfile(e){e.preventDefault();let f=new FormData(e.target);if(+f.get("age")<18)return alert("You must be 18 or older.");s.name=f.get("name");s.age=+f.get("age");s.country=f.get("country");s.goal=f.get("goal");s.bio=f.get("bio");save();alert("Demo profile saved.");render()}
function premium(){return `${heading("Membership","Choose your journey")}<div class="plan"><span class="pill">STARTER</span><h2>Free</h2><div class="price">KSh 0</div><p>Explore profiles and try the demo.</p>${button("Current plan","alert('You are using the free demo.')","alt")}</div><div class="plan featured"><span class="pill">POPULAR</span><h2>Premium</h2><div class="price">KSh 500 <small>/ month</small></div><p>Proposed enhanced discovery and profile features.</p>${button("Choose Premium","payDemo()")}</div><div class="plan"><span class="pill">EXCLUSIVE</span><h2>Premium Plus</h2><div class="price">KSh 1,000 <small>/ month</small></div><p>Proposed priority features and enhanced preferences.</p>${button("Choose Premium Plus","payDemo()")}</div><div class="notice">These are proposed prices. Payments are not connected; no money will be charged.</div>`}
function payDemo(){alert("Payment is not connected yet. No money has been charged.")}
function events(){return `${heading("Offers & Events","Building meaningful connections")}<div class="card"><span class="pill">COMING SOON</span><h3>Virtual Meet & Greet</h3><p>Meet adults and share conversations in a moderated online event.</p></div><div class="card"><span class="pill">COMMUNITY</span><h3>Relationship Conversations</h3><p>Ideas about communication, respect, boundaries and marriage preparation.</p></div>${note()}`}
function ai(){return `${heading("TRY ME AI","Relationship guidance demo")}<div class="card"><p>Ask a general question about healthy relationships, communication or dating safety.</p><form onsubmit="ask(event)"><label>Your question</label><textarea name="q" required></textarea><button class="btn">Get guidance</button></form><div id="answer"></div></div><div class="notice">This is a basic demo, not a connected AI service. Never share passwords or financial information.</div>`}
function ask(e){e.preventDefault();let q=new FormData(e.target).get("q").toLowerCase(),a="Communicate openly, respect boundaries and look for consistent actions rather than promises.";if(q.includes("money")||q.includes("scam"))a="Be cautious of requests for money or verification codes. Never send money to prove love.";else if(q.includes("marriage")||q.includes("serious"))a="Discuss values, children, finances, family expectations and timelines honestly. Take time to understand each other.";else if(q.includes("meet")||q.includes("safe"))a="Meet in a public place, arrange your own transport and tell someone you trust where you will be.";document.getElementById("answer").innerHTML=`<div class="notice">${esc(a)}</div>`}
function owner(){return `${heading("Contact the Owner","Questions and suggestions")}<div class="card"><div class="art">✉</div><h2>Let's build TRY ME together.</h2><p>Send feedback or suggest features for the portal.</p><p class="gold">${OWNER}</p><div class="actions"><a class="btn" href="mailto:${OWNER}?subject=TRY%20ME%20Feedback" style="text-decoration:none">Email Owner</a><button class="btn alt" onclick="prompt('Copy this email', '${OWNER}')">Show email</button></div></div>`}
function settings(){return `${heading("Settings","Manage your demo")}<div class="card"><h3>Account</h3><p>Local demo profile only.</p>${button("Edit Profile","page('profile')")}</div><div class="card"><h3>Privacy & Safety</h3><p>Keep sensitive information private. Never send money to strangers.</p></div><div class="card"><h3>Notifications</h3><p class="muted">Notifications are not connected.</p></div><div class="card"><h3>Reset demo</h3><p class="muted">Clear saved demo information on this device.</p>${button("Reset","reset()","alt")}</div>`}
function reset(){if(confirm("Clear TRY ME demo data?")){localStorage.removeItem("tryme_v1");s={page:"welcome",name:"",age:18,country:"Kenya",goal:"Marriage",bio:"",interests:[],likes:[],matches:[],chats:{}};render()}}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let pages={welcome,signup,interests,home,discover,matches,messages,profile,premium,events,ai,owner,settings};app.innerHTML=(pages[s.page]||home)();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===s.page));document.getElementById("nav").classList.toggle("hidden",["welcome","signup","interests"].includes(s.page))}
render();
</script>
<footer>TRY ME © 2026 · More than a dating app. A journey to forever.</footer>
</body>
</html>
